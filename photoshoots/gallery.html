<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHUKOV — Gallery Editorial</title>
    <link rel="stylesheet" href="/styles.css?v=32">
    <link rel="stylesheet" href="gallery.css?v=34">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="/site-components.js"></script>
</head>

<body class="editorial-body">
    <!-- Dynamic Site Header Slot -->
    <div id="site-header-slot"></div>

    <main id="app-content" class="vogue-gallery-main">
        <div class="gallery-nav-breadcrumb">
            <a href="/photoshoots/" class="vogue-back-link">&larr; RETURN TO PHOTOSHOOTS</a>
        </div>

        <div class="gallery-header" id="gallery-header">
            <!-- Populated by JS -->
        </div>

        <div id="loading-state" class="vogue-loading-state">Loading photoshoot editorial...</div>

        <div class="masonry-grid" id="masonry-grid">
            <!-- Images will be injected here by JS -->
        </div>
    </main>

    <!-- Dynamic Site Footer Slot -->
    <div id="site-footer-slot"></div>

    <!-- Lightbox Modal with Editorial Fine-Art White Frame -->
    <div id="lightbox" class="lightbox">
        <span class="close" id="lightbox-close">&times;</span>
        <div class="lightbox-frame" id="lightbox-frame">
            <div class="lightbox-img-wrapper">
                <img class="lightbox-content" id="lightbox-img" alt="Fullscreen View">
            </div>
            <div class="lightbox-caption-bar">
                <span class="lightbox-author">STANISLAV ZHUKOV</span>
                <span class="lightbox-set-name" id="lightbox-set-name">GALLERY</span>
            </div>
        </div>
    </div>

    <!-- Gallery Script -->
    <script type="module" src="gallery.js?v=34"></script>
</body>

</html>
