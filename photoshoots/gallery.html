<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanislav | Gallery</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            text-decoration: none;
            margin: 1rem 2rem;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }
        .back-link:hover {
            color: #fff;
        }
        
        .gallery-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .gallery-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .gallery-meta {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Intelligent Dense Grid Layout */
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 10px;
            gap: 16px; /* 1rem roughly */
            grid-auto-flow: dense;
            padding: 0 2rem;
            margin-bottom: 4rem;
        }
        @media (max-width: 1200px) {
            .masonry-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 800px) {
            .masonry-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .masonry-grid { grid-template-columns: 1fr; }
        }

        .masonry-item {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden; /* prevents object-fit from bleeding */
            border-radius: 8px; /* apply radius to wrapper */
            /* Start hidden, show after calculation */
            opacity: 0; 
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .masonry-img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; /* perfectly fills the calculated grid span */
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .masonry-img:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .loading-state {
            text-align: center;
            color: #94a3b8;
            padding: 4rem;
            font-size: 1.2rem;
        }

        /* Admin Delete Buttons */
        .img-container {
            position: relative;
            display: block;
        }
        .delete-photo-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .delete-photo-btn:hover {
            background: rgba(255, 0, 0, 1);
            transform: scale(1.1);
        }
        .delete-category-btn {
            background: rgba(255, 0, 0, 0.1);
            color: #ff4d4d;
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 4px;
            padding: 0.3rem 0.8rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            display: inline-block;
        }
        .delete-category-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
        }

        /* Drag and Drop States */
        .masonry-item.dragging {
            opacity: 0.4 !important;
            transform: scale(0.95);
            z-index: 100;
        }
        .masonry-item.drag-over {
            border: 2px dashed #60a5fa;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1>Gallery</h1>
                <p>Full view of the selected photoshoot</p>
            </div>
            <nav class="header-nav">
                <a href="/">Home</a>
                <a href="/photoshoots/" class="active">Photoshoots</a>
                <a href="/about/">About Me</a>
                <a href="/contact/">Contact</a>
                <a href="/upload/" id="upload-nav-link" class="hidden">Upload</a>
            </nav>
            <div class="header-actions">
                <button id="login-btn-header" class="login-btn-header hidden">Login</button>
                <button id="logout-btn" class="logout-btn hidden">Logout</button>
            </div>
        </div>
    </header>
    
    <main id="app-content">
        <a href="/photoshoots/" class="back-link">← Back to Photoshoots</a>
        
        <div class="gallery-header" id="gallery-header">
            <!-- Populated by JS -->
        </div>

        <div id="loading-state" class="loading-state">Loading gallery...</div>
        
        <div class="masonry-grid" id="masonry-grid">
            <!-- Images will be injected here by JS -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Fullscreen View">
    </div>

    <!-- Gallery Script -->
    <script type="module" src="gallery.js"></script>
</body>
</html>
