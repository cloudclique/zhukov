<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>html,body{background:#0f172a}button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#f8fafc;border-radius:8px}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHUKOV.s | Gallery</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="brand-logo">
                <h1 class="brand-name">ZHUKOV</h1>
                <p class="brand-subtitle">studio</p>
            </a>
            <nav class="header-nav">
                <a href="/">Home</a>
                <a href="/photoshoots/" class="active">Photoshoots</a>
                <a href="/about/">About Me</a>
                <a href="/contact/">Contact</a>
                <a href="/upload/" id="upload-nav-link" class="hidden">Upload</a>
                <a href="/photoshoots/archived.html" id="archived-nav-link" class="hidden">Archived</a>
            </nav>
            <div class="header-actions">
                <button id="login-btn-header" class="login-btn-header hidden">Login</button>
                <button id="logout-btn" class="logout-btn hidden">Logout</button>
                <script>
                    if (localStorage.getItem('zhukov_logged_in') === 'true') {
                        document.getElementById('logout-btn').classList.remove('hidden');
                    } else {
                        document.getElementById('login-btn-header').classList.remove('hidden');
                    }
                </script>
            </div>
        </div>
    </header>
    
    <main id="app-content">
        <a href="/photoshoots/" class="back-link">← Back to Photoshoots</a>
        
        <div class="gallery-header" id="gallery-header">
            <!-- Populated by JS -->
        </div>

        <div id="loading-state" class="loading-state">Loading gallery...</div>
        
        <div class="masonry-grid" id="masonry-grid">
            <!-- Images will be injected here by JS -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Fullscreen View">
    </div>

    <!-- Gallery Script -->
    <script type="module" src="gallery.js"></script>
</body>
</html>
