<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>html,body{background:#0f172a}button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#f8fafc;border-radius:8px}</style>
    <!-- Slide-from-bottom transition when arriving via overscroll portal -->
    <script>
    (function() {
        if (sessionStorage.getItem('zhukov_overscroll_nav') === '1') {
            sessionStorage.removeItem('zhukov_overscroll_nav');
            // Inject initial off-screen state before first paint
            var s = document.createElement('style');
            s.id = 'slide-in-init';
            s.textContent = 'html, body { transform: translateY(60px); opacity: 0 !important; }';
            document.head.appendChild(s);
            window.addEventListener('DOMContentLoaded', function() {
                requestAnimationFrame(function() {
                    requestAnimationFrame(function() {
                        s.textContent = 'html, body { transform: translateY(0); opacity: 1 !important; transition: transform 0.72s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease; }';
                        // Clean up after animation
                        setTimeout(function() { if (s.parentNode) s.parentNode.removeChild(s); }, 800);
                    });
                });
            });
        }
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHUKOV.s | Photoshoots</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="photoshoots.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="brand-logo">
                <h1 class="brand-name">ZHUKOV</h1>
                <p class="brand-subtitle">studio</p>
            </a>

            <!-- Mobile Hamburger Button (Top Right on Mobile) -->
            <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <!-- Navigation Container (Desktop Row / Mobile Glass Drawer) -->
            <div class="header-nav-container" id="header-nav-container">
                <nav class="header-nav">
                    <a href="/">Home</a>
                    <a href="/photoshoots/" class="active">Photoshoots</a>
                    <a href="/moodboard/">Moodboard</a>
                    <a href="/about/">About Me</a>
                    <a href="/contact/">Contact</a>
                    <a href="/upload/" id="upload-nav-link" class="hidden">Upload</a>
                    <a href="/photoshoots/archived.html" id="archived-nav-link" class="hidden">Archived</a>
                </nav>
                <div class="header-actions">
                    <button id="login-btn-header" class="login-btn-header hidden">Login</button>
                    <button id="logout-btn" class="logout-btn hidden">Logout</button>
                    <script>
                        if (localStorage.getItem('zhukov_logged_in') === 'true') {
                            document.getElementById('logout-btn').classList.remove('hidden');
                        } else {
                            document.getElementById('login-btn-header').classList.remove('hidden');
                        }
                    </script>
                </div>
            </div>
        </div>
        <script>
            (function() {
                const btn = document.getElementById('mobile-menu-btn');
                const nav = document.getElementById('header-nav-container');
                if (!btn || !nav) return;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = nav.classList.toggle('open');
                    btn.classList.toggle('active', isOpen);
                    btn.setAttribute('aria-expanded', isOpen);
                });
                nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
                    nav.classList.remove('open');
                    btn.classList.remove('active');
                    btn.setAttribute('aria-expanded', 'false');
                }));
                document.addEventListener('click', (e) => {
                    if (!nav.contains(e.target) && !btn.contains(e.target)) {
                        nav.classList.remove('open');
                        btn.classList.remove('active');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        nav.classList.remove('open');
                        btn.classList.remove('active');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                });
            })();
        </script>
    </header>
    
    <main id="app-content">
        <!-- Sort Bar -->
        <div class="sort-bar">
            <select id="sort-select" class="sort-select">
                <option value="category">Sort by Photo set</option>
                <option value="date">Sort by Date</option>
                <option value="model">Sort by Model</option>
                <option value="theme">Sort by Theme</option>
            </select>
            <button id="sort-order-btn" class="sort-btn" data-order="asc">A-Z ↓</button>
        </div>

        <!-- Gallery Categories -->
        <div id="categories-container">
            <!-- Categories will be injected here by JS -->
        </div>
        
        <div id="no-results">
            <p>No photoshoots match your filters.</p>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Fullscreen View">
    </div>

    <!-- We use a custom script for this page -->
    <script type="module" src="script.js"></script>
</body>
</html>
