<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHUKOV — Photoshoots Archive</title>
    <link rel="stylesheet" href="/styles.css?v=45">
    <link rel="stylesheet" href="photoshoots.css?v=47">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script src="/site-components.js"></script>
</head>

<body class="editorial-body photoshoots-body">
    <!-- Dynamic Site Header Slot -->
    <div id="site-header-slot"></div>

    <main id="app-content" class="vogue-page-main">
        <!-- Editorial Section Header (Desktop: Hidden to place Order By directly at header; Mobile: Ultra-compact) -->
        <section class="vogue-subpage-header" id="photoshoots-header">
            <h2 class="subpage-editorial-title">PHOTOSHOOTS</h2>
        </section>

        <!-- Editorial Sort & Catalog Bar -->
        <div class="sort-bar">
            <span class="sort-catalog-tag">EDITORIAL ARCHIVE</span>
            <div class="sort-controls-right">
                <!-- View Mode Switcher -->
                <div class="photoshoots-view-switcher" id="photoshoots-view-switcher" role="group" aria-label="View Mode">
                    <button type="button" class="view-switch-btn active" id="view-flow-btn" data-view="flow" title="Flow View (Continuous Masonry)">
                        <svg class="view-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="8" height="11" rx="0.5"/>
                            <rect x="13" y="3" width="8" height="7" rx="0.5"/>
                            <rect x="13" y="12" width="8" height="9" rx="0.5"/>
                            <rect x="3" y="16" width="8" height="5" rx="0.5"/>
                        </svg>
                        <span>Flow View</span>
                    </button>
                    <button type="button" class="view-switch-btn" id="view-sets-btn" data-view="sets" title="Sets View (Editorial Rows)">
                        <svg class="view-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="4" rx="0.5"/>
                            <rect x="3" y="10" width="18" height="4" rx="0.5"/>
                            <rect x="3" y="16" width="18" height="4" rx="0.5"/>
                        </svg>
                        <span>Sets View</span>
                    </button>
                </div>
                <div class="sort-group">
                    <label for="sort-select" class="sort-label">ORDER BY</label>
                    <select id="sort-select" class="sort-select">
                        <option value="category">Photo Set</option>
                        <option value="date">Date</option>
                        <option value="model">Model</option>
                        <option value="theme">Theme</option>
                    </select>
                    <button id="sort-order-btn" class="sort-btn" data-order="asc">A–Z ↓</button>
                </div>
            </div>
        </div>

        <!-- Flow View (Continuous Masonry Grid) -->
        <div id="flow-container" class="masonry-grid">
            <!-- First 5 photos per photoshoot injected here by JS -->
        </div>

        <!-- Gallery Categories (Sets View Container) -->
        <div id="categories-container" class="vogue-categories-container" style="display: none;">
            <!-- Categories will be injected here by JS -->
        </div>

        <div id="no-results" class="vogue-no-results">
            <p>No photoshoots match your filters.</p>
        </div>
    </main>

    <!-- Dynamic Site Footer Slot -->
    <div id="site-footer-slot"></div>

    <!-- Lightbox Modal with Editorial Fine-Art White Frame -->
    <div id="lightbox" class="lightbox">
        <span class="close" id="lightbox-close">&times;</span>
        <div class="lightbox-frame" id="lightbox-frame">
            <div class="lightbox-img-wrapper">
                <img class="lightbox-content" id="lightbox-img" alt="Fullscreen View">
            </div>
            <div class="lightbox-caption-bar">
                <span class="lightbox-author">STANISLAV ZHUKOV</span>
                <span class="lightbox-set-name" id="lightbox-set-name">PHOTOSHOOT</span>
            </div>
        </div>
        <div class="lightbox-actions" id="lightbox-actions" style="display: none;">
            <a class="lightbox-view-set-btn" id="lightbox-view-set-btn" href="#">
                <span class="btn-text">VIEW FULL SET</span>
                <span class="arrow">&rarr;</span>
            </a>
        </div>
    </div>

    <!-- We use a custom script for this page -->
    <script type="module" src="script.js?v=47"></script>
</body>

</html>
