<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanislav | Photoshoots</title>
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
            padding: 0 1rem;
        }
        .filter-select {
            padding: 0.8rem 1.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            min-width: 200px;
            cursor: pointer;
        }
        .filter-select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.5);
        }
        .filter-select option {
            background: #1a1a1a;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <h1>Photoshoots</h1>
                <p>Explore my recent photoshoot sessions</p>
            </div>
            <nav class="header-nav">
                <a href="/">Home</a>
                <a href="/photoshoots/" class="active">Photoshoots</a>
                <a href="/about/">About Me</a>
                <a href="/contact/">Contact</a>
            </nav>
            <div class="header-actions">
                <button id="login-btn-header" class="login-btn-header hidden">Login</button>
                <button id="logout-btn" class="logout-btn hidden">Logout</button>
            </div>
        </div>
    </header>
    
    <main id="app-content">
        <!-- Filter Bar -->
        <div class="filter-bar">
            <select id="category-filter" class="filter-select">
                <option value="all">All Categories</option>
                <!-- Dynamically populated -->
            </select>
            <select id="model-filter" class="filter-select">
                <option value="all">All Models</option>
                <!-- Dynamically populated -->
            </select>
        </div>

        <!-- Gallery -->
        <div class="gallery" id="gallery">
            <!-- Images will be injected here by JS -->
        </div>
        
        <div id="no-results" style="text-align: center; padding: 4rem; display: none;">
            <p style="color: #94a3b8; font-size: 1.2rem;">No photoshoots match your filters.</p>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Fullscreen View">
    </div>

    <!-- We use a custom script for this page -->
    <script type="module" src="script.js"></script>
</body>
</html>
