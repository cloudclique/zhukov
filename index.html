<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Photography portfolio by Stanislav.">
    <title>Stanislav | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Stanislav</h1>
            <p>A curated collection of moments.</p>
        </div>
    </header>

    <main>
        <div class="gallery" id="gallery">
            <!-- Images will be injected here by app.js -->
        </div>
        <div id="loading" class="loading">Loading gallery...</div>
        <div id="error-message" class="error-message" style="display: none;"></div>
    </main>

    <!-- Lightbox for full screen viewing -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-btn">&times;</span>
        <img class="lightbox-img" id="lightbox-img" src="" alt="Full resolution image">
        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
