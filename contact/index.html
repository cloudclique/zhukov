<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            background: #0f172a
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            border-radius: 8px
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHUKOV.s | Contact</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-content">
            <a href="/" class="brand-logo">
                <h1 class="brand-name">ZHUKOV</h1>
                <p class="brand-subtitle">studio</p>
            </a>

            <!-- Mobile Hamburger Button (Top Right on Mobile) -->
            <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle navigation menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>

            <!-- Navigation Container (Desktop Row / Mobile Glass Drawer) -->
            <div class="header-nav-container" id="header-nav-container">
                <nav class="header-nav">
                    <a href="/">Home</a>
                    <a href="/photoshoots/">Photoshoots</a>
                    <a href="/moodboard/">Moodboard</a>
                    <a href="/about/">About Me</a>
                    <a href="/contact/" class="active">Contact</a>
                </nav>
                <div class="header-actions">
                    <button id="login-btn-header" class="login-btn-header hidden">Login</button>
                    <button id="logout-btn" class="logout-btn hidden">Logout</button>
                    <script>
                        if (localStorage.getItem('zhukov_logged_in') === 'true') {
                            document.getElementById('logout-btn').classList.remove('hidden');
                        } else {
                            document.getElementById('login-btn-header').classList.remove('hidden');
                        }
                    </script>
                </div>
            </div>
        </div>
        <script>
            (function() {
                const btn = document.getElementById('mobile-menu-btn');
                const nav = document.getElementById('header-nav-container');
                if (!btn || !nav) return;
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isOpen = nav.classList.toggle('open');
                    btn.classList.toggle('active', isOpen);
                    btn.setAttribute('aria-expanded', isOpen);
                });
                nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
                    nav.classList.remove('open');
                    btn.classList.remove('active');
                    btn.setAttribute('aria-expanded', 'false');
                }));
                document.addEventListener('click', (e) => {
                    if (!nav.contains(e.target) && !btn.contains(e.target)) {
                        nav.classList.remove('open');
                        btn.classList.remove('active');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        nav.classList.remove('open');
                        btn.classList.remove('active');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                });
            })();
        </script>
    </header>

    <main id="app-content">
        <div class="contact-container">
            <h2>Let's Work Together</h2>
            <p class="contact-text">
                I'm currently available for freelance work and collaborations.
            </p>
            <a href="mailto:contact@zhukov.studio" class="contact-button">Email Me</a>
        </div>
    </main>

    <script type="module" src="/script.js"></script>
</body>

</html>
