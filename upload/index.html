<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>html,body{background:#0f172a}button{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#f8fafc;border-radius:8px}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHUKOV.s | Upload</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="upload.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="brand-logo">
                <h1 class="brand-name">ZHUKOV</h1>
                <p class="brand-subtitle">studio</p>
            </a>
            <nav class="header-nav">
                <a href="/">Home</a>
                <a href="/photoshoots/">Photoshoots</a>
                <a href="/about/">About Me</a>
                <a href="/contact/">Contact</a>
            </nav>
            <div class="header-actions">
                <button id="login-btn-header" class="login-btn-header hidden">Login</button>
                <button id="logout-btn" class="logout-btn hidden">Logout</button>
                <script>
                    if (localStorage.getItem('zhukov_logged_in') === 'true') {
                        document.getElementById('logout-btn').classList.remove('hidden');
                    } else {
                        document.getElementById('login-btn-header').classList.remove('hidden');
                    }
                </script>
            </div>
        </div>
    </header>
    
    <main id="app-content">
        <div id="auth-warning">
            <h2>Admin Access Required</h2>
            <p>Please log in with an administrator account to access this page.</p>
        </div>

        <div id="upload-section" class="upload-container hidden">
            <h2>Upload a New Photo</h2>
            <p class="upload-section-desc">Select an image to upload directly to ImgBB and save to Firestore.</p>
            
            <div class="upload-area" id="drop-zone">
                <p>Drag & Drop images here or click to browse</p>
                <input type="file" id="image-input" accept="image/*" multiple>
                <div id="preview-container"></div>
            </div>

            <div class="input-group">
                <label for="category-input" class="input-label">Photo set Name</label>
                <input type="text" id="category-input" list="category-list" placeholder="e.g. Single Shots or Summer Collection" class="input-field">
                <datalist id="category-list">
                    <option value="Single Shots"></option>
                </datalist>
            </div>

            <div class="input-group">
                <label for="model-input" class="input-label">Model Name (Optional)</label>
                <input type="text" id="model-input" list="model-list" placeholder="e.g. Jane Doe" class="input-field">
                <datalist id="model-list"></datalist>
            </div>

            <div class="input-group">
                <label for="theme-input" class="input-label">Theme (Optional)</label>
                <input type="text" id="theme-input" list="theme-list" placeholder="e.g. Cyberpunk" class="input-field">
                <datalist id="theme-list"></datalist>
            </div>

            <div class="input-group last">
                <label for="desc-input" class="input-label">Description & Links (Optional)</label>
                <textarea id="desc-input" placeholder="e.g. Studio portrait session with @model. Instagram: https://instagram.com/..." class="input-field" rows="2" style="resize: vertical; font-family: inherit;"></textarea>
            </div>
            
            <button id="upload-btn" class="btn" disabled>Upload Photo</button>
            <div id="status-msg"></div>
        </div>
    </main>

    <!-- Import Firebase modules and our custom upload script -->
    <script type="module" src="upload.js"></script>
</body>
</html>
